name: Kronos alerts

on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:

concurrency:
  group: kronos-alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Fetch Kronos code
        run: git clone --depth 1 https://github.com/shiyu-coder/Kronos vendor/Kronos

      - name: Install dependencies (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-kronos-base-v1

      - name: Restore alert state (cooldowns)
        uses: actions/cache@v4
        with:
          path: state
          key: kronos-state-${{ github.run_id }}
          restore-keys: kronos-state-

      - name: Run
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
   run: python main.py --test-discord
