model:
  name: NeoQuasar/Kronos-base
  tokenizer: NeoQuasar/Kronos-Tokenizer-base
  max_context: 512
  device: null

data:
  interval: 15m
  lookback: 400

forecast:
  horizon_bars: 16
  n_paths: 32
  temperature: 1.0
  top_p: 0.9

signal:
  min_move_atr: 1.0        # forecast move must be >= this x recent ATR(14)
  min_agreement: 0.75      # share of sampled paths that must agree on direction
  min_rr: 1.5
  sl_min_atr: 2.0          # minimum stop distance in ATRs (was 0.5 = far too tight)
  tp_rr: null              # null = target from forecast paths; 1.5 = fixed 1.5R target
  cooldown_hours: 4\n  max_entry_drift_atr: 0.25

symbols:
  - name: BTCUSD
    tickers: ["BTC-USD"]
    delta: ["BTCUSD"]
  - name: ETHUSD
    tickers: ["ETH-USD"]
    delta: ["ETHUSD"]
  - name: XAUUSD
    tickers: ["XAUUSD=X", "GC=F"]
    delta: ["XAUTUSD", "PAXGUSD"]
    skip_weekend: true
