model:
  name: NeoQuasar/Kronos-base
  tokenizer: NeoQuasar/Kronos-Tokenizer-base
  max_context: 512
  device: null

data:
  interval: 15m
  lookback: 400

forecast:
  horizon_bars: 16
  n_paths: 8
  temperature: 1.0
  top_p: 0.9

signal:
  min_move_atr: 1.0
  min_agreement: 0.75
  min_rr: 1.5
  cooldown_hours: 4

symbols:
  - name: BTCUSD
    tickers: ["BTC-USD"]
  - name: ETHUSD
    tickers: ["ETH-USD"]
  - name: XAUUSD
    tickers: ["XAUUSD=X", "GC=F"]
